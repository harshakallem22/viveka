# Tier 2: the real quality gate.
#
# The design problem: a free GitHub runner cannot benchmark 8B
# models -- no GPU, ~14GB disk, minutes per item on CPU. A workflow that pretended otherwise would
# be permanently red or quietly disabled, which is worse than no gate at all.
#
# So evidence generation is separated from gate enforcement:
#
#   1. Locally, on hardware that has a GPU:
#        viveka run && viveka judge latest
#        viveka report latest --grader numeric_exact_match --json results/latest.json
#   2. results/latest.json is committed with the PR.
#   3. This job compares it against the accepted results/baseline.json and FAILS THE BUILD on a
#      regression. Pure arithmetic over two JSON files: milliseconds, no GPU.
#
# The obvious hole in committing evidence is staleness or hand-editing. Three defences: the
# golden-set hash must match the baseline, the results must describe the eval set currently on
# disk (checked inside `viveka gate`), and the results file must be newer than the code that
# produces it (checked below, using git timestamps).

name: Regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so the staleness check can read commit timestamps.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Results must be newer than the code that produced them
        # "You changed the prompt but did not re-run the eval" is itself a build failure.
        # Without this, committed evidence could describe a version of the code that no longer
        # exists, and the gate would be comparing fiction.
        run: |
          set -euo pipefail
          results_time=$(git log -1 --format=%ct -- results/latest.json || echo 0)
          if [ "$results_time" = "0" ]; then
            echo "::error::results/latest.json is not committed. Run the benchmark locally and commit it."
            exit 1
          fi
          stale=0
          for path in src/viveka/core/prompts.py src/viveka/core/judges.py src/viveka/core/graders.py viveka.yaml data/golden_set.jsonl; do
            code_time=$(git log -1 --format=%ct -- "$path" || echo 0)
            if [ "$code_time" -gt "$results_time" ]; then
              echo "::error::$path changed after results/latest.json was last updated. Re-run the benchmark."
              stale=1
            fi
          done
          exit $stale

      - name: Run the regression gate
        run: |
          viveka gate \
            --results results/latest.json \
            --baseline results/baseline.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json gate-report.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate-report.json

      - name: Comment the results table on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_Gate summary unavailable._';
            try {
              body = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            } catch (e) {
              core.warning(`could not read step summary: ${e}`);
            }
            const marker = '<!-- viveka-gate -->';
            body = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = existing.data.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
